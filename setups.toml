# Each setup is how the agent runs. `init` lists the flags of `muffle init --agent <agent>`; a setup without it runs
# the agent without muffle.

[base]

[muffle]
init = ["--lean"]

[hush]
init = ["--lean", "--hush"]

[sloth]
init = ["--lean", "--sloth"]

[all]
init = ["--lean", "--hush", "--sloth"]

